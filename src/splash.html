<div id="splash" aria-hidden="true">
<canvas id="spcv"></canvas>
<div id="splogo"><img id="spmark" alt="" src="icons/splash-mark.webp"><img id="sptext" alt="" src="icons/splash-text.webp"></div>
<img id="spball" alt="" src="icons/splash-ball.webp">
</div>
<style>
#splash{position:fixed;inset:0;z-index:2147483000;background:#111115;overflow:hidden;touch-action:manipulation;cursor:pointer}
#spcv{position:absolute;inset:0;width:100%;height:100%;display:block}
#splogo{position:absolute;left:50%;top:46%;width:min(82vw,560px,calc(62vh*1.38));aspect-ratio:1035/750;transform:translate(-50%,-50%)}
#splogo img{position:absolute;left:0;width:100%;display:block}
#spmark{top:0;opacity:0}#sptext{top:81.33%;opacity:0}
#spball{position:absolute;left:0;top:0;width:100px;height:100px;opacity:0;will-change:transform}
html.sp-wait body>*:not(#splash){opacity:0}
@keyframes spIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
html.sp-in body>*:not(#splash){animation:spIn .7s cubic-bezier(.2,.8,.2,1) .1s both}
</style>
<script>
/* Schermata di caricamento: battuta in salto vista come in TV, zoom sulla palla, logo; poi l'app entra in dissolvenza. */
(function(){
var $=function(id){return document.getElementById(id)};
var root=document.documentElement,SP=$('splash');
var meta=document.querySelector('meta[name="theme-color"]'),theme0=meta&&meta.content;
var gone=false,running=false,swapped=false,anims=[],timers=[];
function exit(fast){
  if(gone)return;gone=true;running=false;timers.forEach(clearTimeout);
  root.classList.remove('sp-wait');root.classList.add('sp-in');
  if(meta&&theme0)meta.content=theme0;
  var d=fast?380:650;
  var a=SP.animate([{opacity:1},{opacity:0}],{duration:d,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'});
  try{$('splogo').animate([{transform:'translate(-50%,-50%) scale(1)'},{transform:'translate(-50%,-50%) scale(.9)'}],{duration:d,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'})}catch(e){}
  a.onfinish=function(){SP.remove();setTimeout(function(){root.classList.remove('sp-in')},900)};
  setTimeout(function(){if(SP.parentNode)SP.remove();root.classList.remove('sp-in')},d+1200);
}
if(navigator.webdriver||/[?&]nosplash/.test(location.search)||!window.requestAnimationFrame||!SP.animate){SP.remove();return}
root.classList.add('sp-wait');
if(meta)meta.content='#111115';
SP.addEventListener('click',function(){exit(true)});
timers.push(setTimeout(function(){exit(false)},9000));   // rete di sicurezza
var cv=$('spcv'),g=cv.getContext('2d'),W=0,H=0,DPR=1,BALLIMG=$('spball');
if(!g){exit(true);return}
var rsz;addEventListener('resize',function(){if(gone)return;clearTimeout(rsz);rsz=setTimeout(function(){try{size()}catch(e){}},60)});
/* ---------- world: metres. x along the court (net at 0), y up, z depth (0 near sideline .. 9 far) ---------- */
var cam={x:0,y:3,s:20};
function P(x,y,z){ // world -> screen, slight elevated side view
  var f=1-z*.028, s=cam.s*f;
  return [W/2+(x-cam.x)*s, H*.56-(y+z*.36-cam.y)*s, s];
}

/* ---------- keyframed channels (cubic Hermite) ---------- */
function chan(a,t){
  if(t<=a[0][0])return a[0][1];var n=a.length;if(t>=a[n-1][0])return a[n-1][1];
  var i=0;while(a[i+1][0]<t)i++;
  var t0=a[i][0],t1=a[i+1][0],p0=a[i][1],p1=a[i+1][1],h=t1-t0,u=(t-t0)/h;
  function tg(j){if(j<=0||j>=n-1)return 0;return (a[j+1][1]-a[j-1][1])/(a[j+1][0]-a[j-1][0])}
  var m0=tg(i)*h,m1=tg(i+1)*h,u2=u*u,u3=u2*u;
  return (2*u3-3*u2+1)*p0+(u3-2*u2+u)*m0+(-2*u3+3*u2)*p1+(u3-u2)*m1;
}
/* jump spin serve, times in seconds.
   All limb angles are WORLD angles for a player facing the net (+x): 0 = pointing down, PI/2 = forward, PI = up, negative = behind.
   lean: torso tilt, + = chest towards the net. Elbow/knee = bend of the lower segment. */
var SV={
 x:[[0,-11.4],[.35,-11.35],[.58,-10.95],[.78,-10.45],[.95,-10.1],[1.07,-9.95],[1.3,-9.55],[1.7,-9.15],[2.4,-9.05]],
 air:[[0,0],[.95,0],[1.07,.12],[1.22,.58],[1.3,.6],[1.45,.5],[1.65,.05],[1.72,0],[2.4,0]],
 lean:[[0,.08],[.33,-.02],[.58,.15],[.78,.32],[.95,.52],[1.07,.15],[1.2,-.12],[1.3,.2],[1.45,.5],[1.72,.42],[2.4,.2]],
 head:[[0,.1],[.3,-.5],[.9,-.25],[1.2,-.55],[1.3,-.3],[1.6,.1],[2.4,.1]],
 nU:[[0,.35],[.33,2.75],[.58,1.0],[.78,-.7],[.95,-1.2],[1.07,2.2],[1.2,3.4],[1.3,2.72],[1.45,.75],[1.72,.35],[2.4,.3]],
 nE:[[0,1.1],[.33,.05],[.58,.25],[.78,.1],[.95,.1],[1.07,.35],[1.2,1.25],[1.3,0],[1.45,.25],[1.72,.6],[2.4,.6]],
 fU:[[0,.35],[.33,.3],[.58,-.1],[.78,-.7],[.95,-1.15],[1.07,2.4],[1.2,2.75],[1.3,1.1],[1.45,.45],[1.72,.35],[2.4,.3]],
 fE:[[0,1.1],[.33,.6],[.58,.2],[.95,.1],[1.07,.15],[1.2,.05],[1.3,.6],[1.45,.5],[1.72,.6],[2.4,.6]],
 nH:[[0,.05],[.35,.02],[.58,.6],[.78,-.25],[.95,.85],[1.07,.12],[1.2,.35],[1.3,.45],[1.45,.5],[1.65,.65],[1.72,.75],[2.4,.3]],
 nK:[[0,.1],[.35,.08],[.58,.4],[.78,.45],[.95,1.45],[1.07,.08],[1.2,1.15],[1.3,1.0],[1.45,.6],[1.65,.7],[1.72,1.15],[2.4,.45]],
 fH:[[0,-.08],[.35,-.05],[.58,-.35],[.78,.65],[.95,.75],[1.07,.02],[1.2,.05],[1.3,.1],[1.45,.3],[1.65,.5],[1.72,.62],[2.4,.15]],
 fK:[[0,.1],[.35,.08],[.58,.35],[.78,.55],[.95,1.35],[1.07,.08],[1.2,.9],[1.3,.7],[1.45,.45],[1.65,.6],[1.72,1.05],[2.4,.4]]
};
var L={sh:.45,th:.45,to:.55,nk:.06,hd:.15,ua:.3,fa:.3};
function dir(a){return [Math.sin(a),-Math.cos(a)]}
function add(p,a,l){var d=dir(a);return [p[0]+d[0]*l,p[1]+d[1]*l]}
function skel(o){
  var hip=[0,0];
  var nKn=add(hip,o.nH,L.th),nFt=add(nKn,o.nH-o.nK,L.sh);
  var fKn=add(hip,o.fH,L.th),fFt=add(fKn,o.fH-o.fK,L.sh);
  var up=Math.PI-o.lean;
  var sh=add(hip,up,L.to), nk=add(sh,up,L.nk), hd=add(nk,up-o.head*.4,L.hd);
  var nEl=add(sh,o.nU,L.ua),nHd=add(nEl,o.nU+o.nE,L.fa);
  var fEl=add(sh,o.fU,L.ua),fHd=add(fEl,o.fU+o.fE,L.fa);
  var lo=Math.min(nFt[1],fFt[1]), dy=-lo+.06+o.air;
  var k={hip:hip,nKn:nKn,nFt:nFt,fKn:fKn,fFt:fFt,sh:sh,hd:hd,nEl:nEl,nHd:nHd,fEl:fEl,fHd:fHd};
  for(var q in k)k[q]=[k[q][0]+o.x,k[q][1]+dy];
  k.nAng=o.nU+o.nE;k.ftAir=o.air;k.fDir=[o.nH-o.nK,o.fH-o.fK];return k;
}
function serverPose(t){var o={};for(var c in SV)o[c]=chan(SV[c],t);return o}

/* ---------- the other eleven: back row in reception stance, front row ready to block ---------- */
var TEAM=[ // [x, z, side, front]  side 1 = ours (green), -1 = theirs (red)
  [-1.2,2.2,1,1],[-1.1,7.0,1,1],[-1.3,4.6,1,1],[-6.2,2.0,1,0],[-6.6,7.2,1,0],
  [1.2,2.2,-1,1],[1.1,4.6,-1,1],[1.3,7.0,-1,1],[6.4,1.9,-1,0],[6.9,4.6,-1,0],[6.5,7.4,-1,0]
];
function readyPose(i,t,m){
  var w=Math.sin(t*4.2+i*1.9), b=w*.03;
  var r=m[2]<0&&t>1.42?smooth((t-1.42)/.3):0;   // their back row drops into the dig
  if(m[3])return {x:0,air:0,lean:.05+b*.5,head:0,nU:2.15+b,nE:.75,fU:2.25+b,fE:.7,nH:.28+b,nK:.5,fH:.18-b,fK:.45};
  return {x:Math.sin(t*1.7+i)*.06,air:0,lean:.42+b+r*.12,head:-.1,nU:.65+b+r*.2,nE:.95,fU:.55+b+r*.2,fE:1.0,nH:.55+w*.03+r*.2,nK:1.0+r*.3,fH:.4-w*.03+r*.2,fK:.9+r*.3};
}

/* ---------- drawing ---------- */
var C={floor:'#2c5f9e',court:'#e2873b',line:'#f3f4f1',ink:'#121317',far:'#3a3e46',us:'#0f6b45',them:'#d81f2a',net:'rgba(240,240,240,.55)'};
function poly(pts,fill){g.beginPath();pts.forEach(function(p,i){i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])});g.closePath();g.fillStyle=fill;g.fill()}
function drawArena(){
  var top=g.createLinearGradient(0,0,0,H);top.addColorStop(0,'#0d0e12');top.addColorStop(.6,'#1a1d25');top.addColorStop(1,'#1a1d25');
  g.fillStyle=top;g.fillRect(0,0,W,H);
  // stands: rows of faint dots behind the far side
  var a=P(-16,0,14),b=P(16,0,14);
  g.fillStyle='rgba(255,255,255,.05)';
  for(var r=0;r<7;r++){var y=a[1]-r*a[2]*.55-a[2]*.6;for(var x=-16;x<=16;x+=.55){var p=P(x+(r%2)*.27,0,14);g.beginPath();g.arc(p[0],y,Math.max(.6,a[2]*.09),0,7);g.fill()}}
  // floor
  poly([P(-40,0,-14),P(40,0,-14),P(40,0,13),P(-40,0,13)],C.floor);
  poly([P(-9,0,0),P(9,0,0),P(9,0,9),P(-9,0,9)],C.court);
  g.strokeStyle=C.line;g.lineCap='butt';
  function ln(x1,z1,x2,z2){var p=P(x1,0,z1),q=P(x2,0,z2);g.lineWidth=Math.max(1,.05*p[2]);g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(q[0],q[1]);g.stroke()}
  ln(-9,0,9,0);ln(-9,9,9,9);ln(-9,0,-9,9);ln(9,0,9,9);ln(0,0,0,9);ln(-3,0,-3,9);ln(3,0,3,9);
}
function drawNet(){
  var b0=P(0,0,-.5),t0=P(0,2.24,-.5),b1=P(0,0,9.5),t1=P(0,2.24,9.5),m0=P(0,1.24,-.5),m1=P(0,1.24,9.5);
  poly([t0,t1,m1,m0],C.net);
  g.strokeStyle='#f3f4f1';g.lineWidth=Math.max(1.5,.07*t0[2]);g.beginPath();g.moveTo(t0[0],t0[1]);g.lineTo(t1[0],t1[1]);g.stroke();
  g.strokeStyle='#d4d6da';g.lineWidth=Math.max(2,.08*b0[2]);
  [[b0,t0],[b1,t1]].forEach(function(q){g.beginPath();g.moveTo(q[0][0],q[0][1]+(q[1][1]-q[0][1])*-0.05);g.lineTo(q[1][0],q[1][1]-q[0][2]*.15);g.stroke()});
  // antennas
  [[-.0,0],[0,9]].forEach(function(a){var p=P(0,2.24,a[1]),q=P(0,3.04,a[1]);var n=5;for(var i=0;i<n;i++){g.strokeStyle=i%2?'#f3f4f1':'#d81f2a';g.lineWidth=Math.max(1.5,.03*p[2]);g.beginPath();g.moveTo(p[0],p[1]+(q[1]-p[1])*i/n);g.lineTo(p[0],p[1]+(q[1]-p[1])*(i+1)/n);g.stroke()}});
}
function drawFig(k,z,jersey,face){ // face: 1 looks towards +x, -1 mirrored
  var ox=k.hip[0];
  function S(p){return P(ox+(p[0]-ox)*face,p[1],z)}
  var s=P(0,0,z)[2];
  var sh=P(ox,0,z);g.fillStyle='rgba(0,0,0,'+(.3-.18*Math.min(1,k.ftAir*1.6))+')';g.beginPath();g.ellipse(sh[0],sh[1],.45*s,.07*s,0,0,7);g.fill();
  g.lineCap='round';g.lineJoin='round';
  function chain(pts,w,c){g.strokeStyle=c;g.lineWidth=w*s;g.beginPath();pts.forEach(function(p,i){var q=S(p);i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1])});g.stroke()}
  function foot(ft,ang,c){var tip=add(ft,ang+Math.PI/2+.25,.17);chain([ft,tip],.1,c)}
  var lerp=function(a,b,u){return [a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u]};
  chain([k.sh,k.fEl,k.fHd],.11,C.far);
  chain([k.hip,k.fKn,k.fFt],.13,C.far);foot(k.fFt,k.fDir[1],C.far);
  chain([k.hip,k.nKn,k.nFt],.13,C.ink);foot(k.nFt,k.fDir[0],C.ink);
  chain([k.hip,lerp(k.hip,k.sh,.22)],.27,C.ink);                 // shorts
  chain([lerp(k.hip,k.sh,.2),lerp(k.hip,k.sh,.92)],.3,jersey);   // jersey
  var h=S(k.hd);g.fillStyle=C.ink;g.beginPath();g.arc(h[0],h[1],.15*s,0,7);g.fill();
  chain([k.sh,k.nEl,k.nHd],.11,C.ink);
}
var ballSpin=0;
function drawBall(p,z,blur){
  var q=P(p[0],p[1],z),r=.105*q[2];
  if(blur){for(var i=3;i>0;i--){var b=P(p[0]-blur[0]*i*.008,p[1]-blur[1]*i*.008,z);g.globalAlpha=.12*(4-i);g.drawImage(BALLIMG,b[0]-r,b[1]-r,2*r,2*r)}g.globalAlpha=1}
  g.save();g.translate(q[0],q[1]);g.rotate(ballSpin);g.drawImage(BALLIMG,-r,-r,2*r,2*r);g.restore();
  return [q[0],q[1],r];
}

/* ---------- serve + ball flight ---------- */
var SZ=2.2;                // server depth
var TR=.33,TC=1.3,G=-9.8,GS=-15;   // toss release, contact; topspin pulls the ball down harder
var P0,PC,V0,V1;
function handBall(k){var d=dir(k.nAng);return [k.nHd[0]+d[0]*.1-.03,k.nHd[1]+d[1]*.1]}
function plan(){
  P0=handBall(skel(serverPose(TR)));
  PC=handBall(skel(serverPose(TC)));PC[1]+=.03;
  var T=TC-TR;V0=[(PC[0]-P0[0])/T,(PC[1]-P0[1]-.5*G*T*T)/T];
  var land=[6.2,.11],TF=.95;V1=[(land[0]-PC[0])/TF,(land[1]-PC[1]-.5*GS*TF*TF)/TF];
}
function ballAt(t,k){
  if(t<TR)return handBall(k);
  if(t<TC){var s=t-TR;return [P0[0]+V0[0]*s,P0[1]+V0[1]*s+.5*G*s*s]}
  s=t-TC;return [PC[0]+V1[0]*s,PC[1]+V1[1]*s+.5*GS*s*s];
}

/* ---------- camera ---------- */
var TZ=1.36, TH=2.02;  // start of the zoom on the ball, hand-off to the logo
function smooth(u){u=Math.max(0,Math.min(1,u));return u*u*(3-2*u)}
function camAt(t,ball){
  var wide=Math.min(W/25,H/9.5), close=Math.min(W/7,H/5.6);
  var u=smooth((t-.45)/.85);
  var cx=-1+(-9.4+1)*u, cy=2.6+(2.55-2.6)*u, s=wide*Math.pow(close/wide,u);
  if(t>TZ){
    var v=Math.min(1,(t-TZ)/(TH-TZ)), e=smooth(v/.22), e2=Math.pow(v,1.8);
    var bq=[ball[0],ball[1]+SZ*.36];
    cx=cx+(bq[0]-cx)*e;cy=cy+(bq[1]-cy)*e;
    var fin=.94*Math.min(W,H)/(.21*(1-SZ*.028));
    s=s*Math.pow(fin/s,e2);
  }
  cam.x=cx;cam.y=cy;cam.s=s;
}

/* ---------- frame (rt = real time; the contact freezes for a beat, like a game hit-stop) ---------- */
var HS=.075;
function sceneT(rt){return rt<TC?rt:(rt<TC+HS?TC:rt-HS)}
function rnd(i){var x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function frame(rt){
  var t=sceneT(rt);
  var k=skel(serverPose(Math.min(t,2.4)));
  var b=ballAt(t,k);
  camAt(t,b);
  var since=rt-TC;
  if(since>0&&since<.3){var a=(1-since/.3)*.12;cam.x+=Math.sin(since*90)*a;cam.y+=Math.cos(since*70)*a*.6}
  ballSpin=t<TR?0:(t-TR)*(t>TC?28:4);
  drawArena();
  var figs=TEAM.map(function(m,i){var o=readyPose(i,t,m);o.x+=m[0];return {k:skel(o),z:m[1],c:m[2]>0?C.us:C.them,f:m[2]}});
  figs.push({k:k,z:SZ,c:C.us,f:1});
  figs.sort(function(a,b){return b.z-a.z});
  figs.forEach(function(F){drawFig(F.k,F.z,F.c,F.f)});
  drawNet();
  // impact: flash, ring and spikes at the contact point
  if(since>=0&&since<.32){
    var c=P(PC[0],PC[1],SZ),u=since/.32;
    g.save();g.globalAlpha=Math.max(0,1-u*1.4)*.9;g.fillStyle='#fff';g.beginPath();g.arc(c[0],c[1],c[2]*(.25+u*.35),0,7);g.fill();
    g.globalAlpha=1-u;g.strokeStyle='#fff';g.lineWidth=Math.max(2,c[2]*.05*(1-u));g.beginPath();g.arc(c[0],c[1],c[2]*(.2+u*1.1),0,7);g.stroke();
    g.lineCap='round';for(var i=0;i<12;i++){var an=i/12*Math.PI*2+.2,r1=c[2]*(.35+u*.9),r2=r1+c[2]*(.35*(1-u)+.05);
      g.lineWidth=Math.max(1.5,c[2]*.04);g.beginPath();g.moveTo(c[0]+Math.cos(an)*r1,c[1]+Math.sin(an)*r1);g.lineTo(c[0]+Math.cos(an)*r2,c[1]+Math.sin(an)*r2);g.stroke()}
    g.restore();
  }
  // speed lines while the camera rides the ball
  if(since>.12){
    var al=Math.min(1,(since-.12)/.15)*.35;g.save();g.strokeStyle='rgba(255,255,255,'+al+')';g.lineCap='round';
    for(var j=0;j<16;j++){var y=rnd(j)*H, len=W*(.15+rnd(j+40)*.3), sp=W*(2.2+rnd(j+80)*1.5), x=W-((since*sp+rnd(j+20)*W*2)%(W*2));
      g.lineWidth=1+rnd(j+60)*2.5;g.beginPath();g.moveTo(x,y);g.lineTo(x-len,y);g.stroke()}
    g.restore();
  }
  // as the camera dives onto the ball, the arena sinks into the logo's dark ground
  if(t>TZ){var dk=Math.pow(Math.min(1,(t-TZ)/(TH-TZ)),1.3)*.92;g.fillStyle='rgba(17,17,21,'+dk+')';g.fillRect(0,0,W,H)}
  var bl=t>TC?[V1[0],V1[1]+GS*(t-TC)]:null;
  return drawBall(b,SZ,bl&&t<TZ+.3?bl:null);
}


var SPEED=.78,t0=0;
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function size(){DPR=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0);plan()}
function A(el,kf,o){var a=el.animate(kf,Object.assign({fill:'both'},o));a.playbackRate=SPEED;anims.push(a);return a}
var lastBall=[0,0,10];
function tick(){
  if(!running||gone)return;
  var t=(performance.now()-t0)/1000*SPEED;
  lastBall=frame(Math.min(t,TH+HS));
  if(t>=TH+HS&&!swapped){swapped=true;swap(lastBall)}
  if(t<TH+HS+.1)requestAnimationFrame(tick);else running=false;
}
function swap(bq){
  var Lr=$('splogo').getBoundingClientRect();
  var D=Lr.width*386/1035, cx=Lr.left+Lr.width*509/1035, cy=Lr.top+Lr.height*305/750;
  var b=$('spball');b.style.width=b.style.height=D+'px';b.style.left=(cx-D/2)+'px';b.style.top=(cy-D/2)+'px';
  var s0=2*bq[2]/D, r0=ballSpin*180/Math.PI;
  function tr(x,y,s,r){return 'translate('+(x-cx)+'px,'+(y-cy)+'px) scale('+s+') rotate('+r+'deg)'}
  var r1=Math.ceil((r0+300)/360)*360;
  A(b,[{transform:tr(bq[0],bq[1],s0,r0),opacity:1},{transform:tr(cx,cy,1,r1),opacity:1}],{duration:700,easing:'cubic-bezier(.3,0,.15,1)'});
  A(cv,[{opacity:1},{opacity:0}],{duration:380,easing:'ease-out'});
  A($('spmark'),[{opacity:0,transform:'scale(1.12)'},{opacity:1,transform:'scale(1)'}],{duration:520,delay:520,easing:'cubic-bezier(.2,.8,.2,1)'});
